name: Build APK

on:
  push:
    branches: [main, 'stage*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.32.8'
  NDK_VERSION: '27.3.13750724'
  CMAKE_VERSION: '3.31.6'
  LLAMA_TAG: 'b12191'
  LLAMA_COMMIT: 'e95426f16982054c379ca7bdc8186996dd22f0fe'
  SD_COMMIT: '9234ad822a376a4724638467736118ed61d68ee9'   # stable-diffusion.cpp master-1056-9234ad8
  # Parallel compile jobs for stable-diffusion.cpp (some sources need >3 GB RAM each).
  KIRO_SD_JOBS: '3'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Secrets are mapped to env so they can be tested in `if:` without exposing them.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --timeout 120s

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/${CMAKE_VERSION}/bin" >> "$GITHUB_PATH"

      # ---- libkiro_sd.so (stable-diffusion.cpp), built once per source/NDK change ----
      - name: Cache libkiro_sd.so
        id: sd-cache
        uses: actions/cache@v6
        with:
          path: prebuilt/sd
          key: kiro-sd-${{ env.SD_COMMIT }}-ndk-${{ env.NDK_VERSION }}-${{ hashFiles('native/kiro_sd/**') }}

      - name: Build libkiro_sd.so
        if: steps.sd-cache.outputs.cache-hit != 'true'
        run: |
          SRC="$RUNNER_TEMP/sdcpp"
          git init -q "$SRC"
          git -C "$SRC" remote add origin https://github.com/leejet/stable-diffusion.cpp.git
          git -C "$SRC" fetch -q --depth 1 origin "$SD_COMMIT"
          git -C "$SRC" checkout -q FETCH_HEAD
          git -C "$SRC" submodule update --init --depth 1 ggml || git -C "$SRC" submodule update --init ggml
          test "$(git -C "$SRC" rev-parse HEAD)" = "$SD_COMMIT"
          cmake -S native/kiro_sd -B "$RUNNER_TEMP/sd-build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release -DKIRO_SD_SRC="$SRC" > /dev/null
          cmake --build "$RUNNER_TEMP/sd-build" --target kiro_sd -j "$KIRO_SD_JOBS" \
            || cmake --build "$RUNNER_TEMP/sd-build" --target kiro_sd -j 1
          mkdir -p prebuilt/sd
          cp "$RUNNER_TEMP/sd-build/libkiro_sd.so" prebuilt/sd/
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded prebuilt/sd/libkiro_sd.so

      # ---- FFmpeg 8.1.3 + x264 command-line binary, packaged as libkiro_ffmpeg.so ----
      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: prebuilt/ffmpeg
          key: kiro-ffmpeg-ndk-${{ env.NDK_VERSION }}-${{ hashFiles('tool/ffmpeg/build_ffmpeg.sh') }}

      - name: Build FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          KIRO_FFMPEG_WORK="$RUNNER_TEMP/ffmpeg-work" bash tool/ffmpeg/build_ffmpeg.sh android prebuilt/ffmpeg > "$RUNNER_TEMP/ffmpeg.log" 2>&1 \
            || { tail -n 60 "$RUNNER_TEMP/ffmpeg.log"; exit 1; }
          tail -n 2 "$RUNNER_TEMP/ffmpeg.log"

      - name: Stage prebuilt native binaries
        run: |
          JNI=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNI"
          cp prebuilt/sd/libkiro_sd.so "$JNI/libkiro_sd.so"
          cp prebuilt/ffmpeg/ffmpeg "$JNI/libkiro_ffmpeg.so"
          file "$JNI"/*.so
          file "$JNI/libkiro_ffmpeg.so" | grep -q 'ARM aarch64' || { echo "FFmpeg is not an arm64 binary" >&2; exit 1; }

      - name: ccache for llama.cpp
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: llama-${{ env.LLAMA_TAG }}-ndk-${{ env.NDK_VERSION }}
          max-size: 1G

      - name: Fetch llama.cpp (pinned tag, verified commit)
        run: |
          git clone -q --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          ACTUAL=$(git -C "$RUNNER_TEMP/llama.cpp" rev-parse HEAD)
          if [ "$ACTUAL" != "$LLAMA_COMMIT" ]; then
            echo "llama.cpp tag $LLAMA_TAG points to $ACTUAL, expected $LLAMA_COMMIT" >&2
            exit 1
          fi
          echo "KIRO_LLAMA_SRC=$RUNNER_TEMP/llama.cpp" >> "$GITHUB_ENV"

      - name: Release signing (from repository secrets)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          # Public certificate fingerprint for the in-app tamper check (not a secret).
          SHA=$(keytool -list -v -keystore android/app/upload-keystore.jks -alias "$KEY_ALIAS" \
                  -storepass:env KEYSTORE_PASSWORD | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr -d ' ')
          if [ -z "$SHA" ]; then echo "Could not read the signing certificate" >&2; exit 1; fi
          echo "KIRO_EXPECTED_CERT_SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Debug signing notice
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::No KEYSTORE_BASE64 secret; the APK is signed with a temporary debug key and the signature check is skipped."

      - name: Build release APK (arm64, obfuscated)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate --split-debug-info=build/symbols

      - name: Verify the APK contents
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -l "$APK" | grep 'lib/' | awk '{print $4}' | sort
          for lib in libkiro_llm.so libllama.so libggml.so libggml-base.so libc++_shared.so libflutter.so \
                     libkiro_sd.so libkiro_ffmpeg.so libsherpa-onnx-c-api.so libonnxruntime.so; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$lib" || { echo "missing $lib" >&2; exit 1; }
          done
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libggml-cpu' || { echo "missing ggml CPU backend variants" >&2; exit 1; }
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/'; then echo "unexpected ABI" >&2; exit 1; fi
          if unzip -l "$APK" | grep -E '\.wasm$'; then echo "web-only .wasm asset packaged" >&2; exit 1; fi
          ls -l "$APK"

      - name: Rename APK
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/kiro-v${VERSION}-arm64.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: kiro-apk
          path: dist/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: kiro-debug-symbols
          path: build/symbols
          retention-days: 30

      - name: GitHub Release (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Kiro ${{ github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          files: dist/*.apk

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
