name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.32.8'
  NDK_VERSION: '27.3.13750724'
  CMAKE_VERSION: '3.31.6'
  LLAMA_TAG: 'b12191'
  LLAMA_COMMIT: 'e95426f16982054c379ca7bdc8186996dd22f0fe'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Secrets are mapped to env so they can be tested in `if:` without exposing them.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null
          ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"

      - name: ccache for llama.cpp
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: llama-${{ env.LLAMA_TAG }}-ndk-${{ env.NDK_VERSION }}
          max-size: 1G

      - name: Fetch llama.cpp (pinned tag, verified commit)
        run: |
          git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          ACTUAL=$(git -C "$RUNNER_TEMP/llama.cpp" rev-parse HEAD)
          if [ "$ACTUAL" != "$LLAMA_COMMIT" ]; then
            echo "llama.cpp tag $LLAMA_TAG points to $ACTUAL, expected $LLAMA_COMMIT" >&2
            exit 1
          fi
          echo "KIRO_LLAMA_SRC=$RUNNER_TEMP/llama.cpp" >> "$GITHUB_ENV"

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Release signing (from repository secrets)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties
          # Public certificate fingerprint for the in-app tamper check (not a secret).
          SHA=$(keytool -list -v -keystore android/app/upload-keystore.jks -alias "$KEY_ALIAS" \
                  -storepass:env KEYSTORE_PASSWORD | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr -d ' ')
          if [ -z "$SHA" ]; then echo "Could not read the signing certificate" >&2; exit 1; fi
          echo "KIRO_EXPECTED_CERT_SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Debug signing notice
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::No KEYSTORE_BASE64 secret; the APK is signed with a temporary debug key and the signature check is skipped."

      - name: Build release APK (arm64, obfuscated)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate --split-debug-info=build/symbols \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }}

      - name: Verify native libraries in the APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -l "$APK" | grep 'lib/' | awk '{print $4}' | sort
          for lib in libkiro_llm.so libllama.so libggml.so libggml-base.so libc++_shared.so libflutter.so; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$lib" || { echo "missing $lib" >&2; exit 1; }
          done
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libggml-cpu' || { echo "missing ggml CPU backend variants" >&2; exit 1; }
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/'; then echo "unexpected ABI" >&2; exit 1; fi

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/kiro-v1.0.${{ github.run_number }}-arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: kiro-apk
          path: dist/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kiro-debug-symbols
          path: build/symbols
          retention-days: 30

      - name: GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: کیرو v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            ساخت خودکار از ${{ github.sha }} — مرحلهٔ ۱ (گفتگو، مدل روی گوشی، مهارت‌ها، کپشن و هشتگ).
            فقط برای پردازنده‌های arm64 (اندروید ۸ به بالا).
          files: dist/*.apk

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
