name: kiro
description: "کیرو — دستیار تولید محتوای اینستاگرام با هوش مصنوعی روی گوشی (آفلاین)."
publish_to: 'none'

version: 1.3.0+12

environment:
  sdk: ^3.8.1
  flutter: '>=3.32.0 <3.33.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5+1
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  http: ^1.6.0
  crypto: ^3.0.8
  intl: ^0.20.2
  ffi: ^2.1.0
  # Offline TTS (Piper voices). Pinned to the last 1.x release: 2.0 removed the espeak-ng
  # phonemizer that Piper voices need.
  sherpa_onnx: 1.13.8
  video_player: ^2.10.0
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
  assets:
    - assets/fonts/OFL.txt
    - assets/music/
    - assets/licenses/
    - assets/tts/
    - assets/tts/espeak-ng-data/
    - assets/tts/espeak-ng-data/lang/ira/
    - assets/tts/espeak-ng-data/lang/gmw/
